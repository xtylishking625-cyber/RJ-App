<script>
        // Fixed Navigation Engine for 100% Working Clicks
        function switchView(viewName) {
            // Saare views ko pehle hide karo
            document.querySelectorAll('.app-view').forEach(view => {
                view.classList.remove('active-view');
            });
            // Saare navigation buttons se active color hatao
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Asli click target ko target karo aur active class do
            document.getElementById(viewName + '-view').classList.add('active-view');
            
            // Auto highlight corresponding button safely
            const targetBtn = Array.from(document.querySelectorAll('.nav-btn')).find(btn => btn.innerText.toLowerCase().includes(viewName));
            if(targetBtn) targetBtn.classList.add('active');
        }

        // Live Earning Calculator Logic
        function updateCalculator(val) {
            const formattedVal = parseInt(val).toLocaleString();
            document.getElementById('slider-val').innerText = formattedVal + " views";
            document.getElementById('traffic-txt').innerText = formattedVal + " views/mo";
            
            const pkrEarning = Math.round((val / 1000) * 840);
            document.getElementById('revenue-txt').innerText = pkrEarning.toLocaleString() + " PKR";
            
            const progress = ((pkrEarning / 500000) * 100).toFixed(1);
            const cappedProgress = progress > 100 ? 100 : progress;
            
            document.getElementById('target-txt').innerText = cappedProgress + "%";
            document.getElementById('progress-percent').innerText = cappedProgress + "%";
            document.getElementById('live-bar').style.width = cappedProgress + "%";
        }

        // Admin Dashboard Chart Generation Look
        const ctx = document.getElementById('adminChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                datasets: [{
                    label: 'User Retention & Earning Curves',
                    data: [12, 19, 3, 5, 2, 3, 20, 33, 45, 53.8, 60],
                    borderColor: '#FFD700',
                    backgroundColor: 'rgba(255, 215, 0, 0.05)',
                    borderWidth: 2,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });
    </script>
