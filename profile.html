<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile • RJ App 👑</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070312;
  color:white;
}

header{
  background:linear-gradient(135deg,#12061F,#8B5CF6);
  padding:35px 20px;
  text-align:center;
}

header h1{
  font-size:32px;
}

main{
  max-width:800px;
  margin:auto;
  padding:25px 15px;
}

.back{
  display:inline-block;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 17px;
  border-radius:10px;
  margin-bottom:25px;
}

.profile{
  background:#12061F;
  border:1px solid #34204d;
  border-radius:20px;
  padding:30px;
  text-align:center;
}

.avatar{
  width:100px;
  height:100px;
  margin:auto;
  border-radius:50%;
  background:#8B5CF6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h2{
  margin-top:15px;
}

.role{
  color:#b8b5c5;
  margin-top:8px;
}

.bio{
  color:#b8b5c5;
  margin-top:12px;
  line-height:1.5;
}

.location{
  color:#b8b5c5;
  margin-top:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:25px;
}

.stat{
  background:#211034;
  padding:15px 8px;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#b8b5c5;
  font-size:12px;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  border:none;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.btn.following{
  background:#34204d;
}

.edit-box{
  display:none;
  background:#211034;
  margin-top:25px;
  padding:20px;
  border-radius:15px;
  text-align:left;
}

.edit-box h3{
  margin-bottom:15px;
}

.edit-box input,
.edit-box textarea{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:8px;
  background:#12061F;
  color:white;
  outline:none;
}

.edit-box textarea{
  min-height:90px;
  resize:vertical;
}

.message{
  margin-top:15px;
  color:#b8b5c5;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#12061F;
  color:#b8b5c5;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>👤 RJ APP — Profile</h1>
</header>

<main>

<a class="back" href="index.html">🏠 Back to Home</a>

<div class="profile">

  <div class="avatar" id="avatar">👑</div>

  <h2 id="name">Raja King 👑</h2>

  <p class="role" id="role">
    Author • Reader • Story Creator
  </p>

  <p class="bio" id="bio">
    Welcome to Raja King World 👑
  </p>

  <p class="location" id="location">
    📍 Taxila, Pakistan
  </p>

  <div class="stats">

    <div class="stat">
      <strong id="fansCount">0</strong>
      <span>Fans</span>
    </div>

    <div class="stat">
      <strong>2</strong>
      <span>Stories</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Views</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Likes</span>
    </div>

  </div>

  <div class="actions">

    <button class="btn" id="followBtn">
      👥 Follow
    </button>

    <button class="btn" id="editBtn">
      ✏️ Edit Profile
    </button>

    <a class="btn" href="stories.html">
      📖 My Stories
    </a>

  </div>

  <div class="edit-box" id="editBox">

    <h3>✏️ Edit Your Profile</h3>

    <input
      type="text"
      id="editName"
      placeholder="Your name"
    >

    <input
      type="text"
      id="editRole"
      placeholder="Your role"
    >

    <textarea
      id="editBio"
      placeholder="Your bio"
    ></textarea>

    <input
      type="text"
      id="editLocation"
      placeholder="Your location"
    >

    <input
      type="text"
      id="editAvatar"
      placeholder="Avatar emoji, e.g. 👑"
    >

    <button class="btn" id="saveBtn">
      💾 Save Profile
    </button>

  </div>

  <p class="message" id="message"></p>

</div>

</main>

<footer>
  © 2026 RJ App 👑
</footer>

<script>

const profileKey = "rjProfile";

const savedProfile =
  JSON.parse(localStorage.getItem(profileKey)) || {};

const defaultProfile = {
  name: "Raja King 👑",
  role: "Author • Reader • Story Creator",
  bio: "Welcome to Raja King World 👑",
  location: "Taxila, Pakistan",
  avatar: "👑"
};

const profile = {
  ...defaultProfile,
  ...savedProfile
};

const nameEl = document.getElementById("name");
const roleEl = document.getElementById("role");
const bioEl = document.getElementById("bio");
const locationEl = document.getElementById("location");
const avatarEl = document.getElementById("avatar");

const editBtn = document.getElementById("editBtn");
const editBox = document.getElementById("editBox");
const saveBtn = document.getElementById("saveBtn");

const editName = document.getElementById("editName");
const editRole = document.getElementById("editRole");
const editBio = document.getElementById("editBio");
const editLocation = document.getElementById("editLocation");
const editAvatar = document.getElementById("editAvatar");

const message = document.getElementById("message");

function showProfile(){

  nameEl.textContent = profile.name;
  roleEl.textContent = profile.role;
  bioEl.textContent = profile.bio;
  locationEl.textContent = "📍 " + profile.location;

  avatarEl.textContent = profile.avatar || "👑";

  editName.value = profile.name;
  editRole.value = profile.role;
  editBio.value = profile.bio;
  editLocation.value = profile.location;
  editAvatar.value = profile.avatar || "👑";
}

showProfile();


/* =========================
   FOLLOW / FANS SYSTEM
========================= */

const fansKey = "rjFans";
const followingKey = "rjFollowing";

let fans =
  Number(localStorage.getItem(fansKey)) || 0;

let isFollowing =
  localStorage.getItem(followingKey) === "true";

const fansCount =
  document.getElementById("fansCount");

const followBtn =
  document.getElementById("followBtn");

function updateFollow(){

  fansCount.textContent = fans;

  if(isFollowing){

    followBtn.textContent = "✅ Following";
    followBtn.classList.add("following");

  }else{

    followBtn.textContent = "👥 Follow";
    followBtn.classList.remove("following");

  }
}

updateFollow();


followBtn.addEventListener("click", function(){

  if(isFollowing){

    isFollowing = false;

    if(fans > 0){
      fans--;
    }

    message.textContent =
      "Aap ne Raja King ko unfollow kar diya.";

  }else{

    isFollowing = true;
    fans++;

    message.textContent =
      "🎉 Aap ab Raja King ke fan hain!";

  }

  localStorage.setItem(
    fansKey,
    fans
  );

  localStorage.setItem(
    followingKey,
    isFollowing
  );

  updateFollow();

});


/* =========================
   EDIT PROFILE
========================= */

editBtn.addEventListener("click", function(){

  if(editBox.style.display === "block"){

    editBox.style.display = "none";
    editBtn.textContent = "✏️ Edit Profile";

  }else{

    editBox.style.display = "block";
    editBtn.textContent = "❌ Close Edit";

  }

});


saveBtn.addEventListener("click", function(){

  profile.name =
    editName.value.trim() || defaultProfile.name;

  profile.role =
    editRole.value.trim() || defaultProfile.role;

  profile.bio =
    editBio.value.trim() || defaultProfile.bio;

  profile.location =
    editLocation.value.trim() || defaultProfile.location;

  profile.avatar =
    editAvatar.value.trim() || defaultProfile.avatar;

  localStorage.setItem(
    profileKey,
    JSON.stringify(profile)
  );

  showProfile();

  message.textContent =
    "✅ Profile successfully saved!";

  editBox.style.display = "none";

  editBtn.textContent = "✏️ Edit Profile";

});

</script>

</body>
</html>
