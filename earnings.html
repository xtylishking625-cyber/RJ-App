<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings • RJ App 👑</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#070312;
  color:white;
}

header{
  background:linear-gradient(135deg,#12061F,#8B5CF6);
  padding:30px 20px;
  text-align:center;
}

header h1{font-size:32px}

header p{
  margin-top:8px;
  color:#eee;
}

main{
  max-width:900px;
  margin:auto;
  padding:25px 15px;
}

.back{
  display:inline-block;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 17px;
  border-radius:10px;
  margin-bottom:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.card{
  background:#12061F;
  border:1px solid #34204d;
  border-radius:18px;
  padding:25px;
}

.card h3{
  margin-bottom:10px;
}

.amount{
  font-size:28px;
  font-weight:bold;
  color:#A855F7;
}

.note{
  margin-top:10px;
  color:#b8b5c5;
  line-height:1.5;
}

.panel{
  margin-top:20px;
  background:#12061F;
  border:1px solid #34204d;
  border-radius:18px;
  padding:25px;
}

.btn{
  display:inline-block;
  margin-top:18px;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 17px;
  border-radius:10px;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#12061F;
  color:#b8b5c5;
}
</style>
</head>

<body>

<header>
  <h1>💰 RJ APP — Earnings</h1>
  <p>Track your author earnings 👑</p>
</header>

<main>

<a class="back" href="index.html">🏠 Back to Home</a>

<div class="cards">

  <div class="card">
    <h3>💵 Balance</h3>
    <div class="amount">$0.00</div>
    <p class="note">Available balance</p>
  </div>

  <div class="card">
    <h3>📚 Stories</h3>
    <div class="amount">0</div>
    <p class="note">Published stories</p>
  </div>

  <div class="card">
    <h3>👁️ Views</h3>
    <div class="amount">0</div>
    <p class="note">Total story views</p>
  </div>

</div>

<div class="panel">

  <h2>💳 Payment</h2>

  <p class="note">
    Your future RJ App earnings and withdrawal
    information will appear here.
  </p>

  <a class="btn" href="#">
    💰 Withdrawal
  </a>

</div>

</main>

<footer>
  © 2026 RJ App 👑
</footer>

</body>
</html>
