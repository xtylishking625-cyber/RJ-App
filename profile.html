<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile • RJ App 👑</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070312;
  color:white;
}

header{
  background:linear-gradient(135deg,#12061F,#8B5CF6);
  padding:35px 20px;
  text-align:center;
}

header h1{
  font-size:32px;
}

main{
  max-width:800px;
  margin:auto;
  padding:25px 15px;
}

.back{
  display:inline-block;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 17px;
  border-radius:10px;
  margin-bottom:25px;
}

.profile{
  background:#12061F;
  border:1px solid #34204d;
  border-radius:20px;
  padding:30px;
  text-align:center;
}

.avatar{
  width:100px;
  height:100px;
  margin:auto;
  border-radius:50%;
  background:#8B5CF6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

h2{
  margin-top:15px;
}

.role{
  color:#b8b5c5;
  margin-top:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:25px;
}

.stat{
  background:#211034;
  padding:15px 8px;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#b8b5c5;
  font-size:12px;
}

.btn{
  display:inline-block;
  margin-top:25px;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 18px;
  border-radius:10px;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#12061F;
  color:#b8b5c5;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>👤 RJ APP — Profile</h1>
</header>

<main>

<a class="back" href="index.html">🏠 Back to Home</a>

<div class="profile">

  <div class="avatar">👑</div>

  <h2>Raja King 👑</h2>

  <p class="role">
    Author • Reader • Story Creator
  </p>

  <div class="stats">

    <div class="stat">
      <strong>0</strong>
      <span>Fans</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Stories</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Views</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Likes</span>
    </div>

  </div>

  <a class="btn" href="stories.html">
    📖 My Stories
  </a>

</div>

</main>

<footer>
  © 2026 RJ App 👑
</footer>

</body>
</html>
