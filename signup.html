<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>RJ App - Sign Up 👑</title> <style> *{ box-sizing:border-box; margin:0; padding:0; font-family:Arial,sans-serif; } body{ min-height:100vh; background:linear-gradient(135deg,#070312,#12061F); color:white; display:flex; justify-content:center; align-items:center; padding:20px; } .signup-box{ width:100%; max-width:430px; background:#12061F; border:1px solid #8B5CF6; border-radius:22px; padding:35px 28px; box-shadow:0 0 30px rgba(139,92,246,.25); text-align:center; } .logo{ font-size:42px; font-weight:bold; color:#A855F7; margin-bottom:8px; } .subtitle{ color:#B8B5C5; margin-bottom:30px; } h1{ margin-bottom:22px; font-size:28px; } .input-group{ text-align:left; margin-bottom:18px; } label{ display:block; margin-bottom:8px; color:#B8B5C5; font-size:14px; } input{ width:100%; padding:14px; border-radius:10px; border:1px solid #8B5CF6; background:#070312; color:white; font-size:16px; outline:none; } input:focus{ border-color:#A855F7; } .signup-btn{ width:100%; padding:14px; margin-top:8px; border:none; border-radius:10px; background:linear-gradient(90deg,#8B5CF6,#A855F7); color:white; font-size:17px; font-weight:bold; cursor:pointer; } .signup-btn:disabled{ opacity:.6; cursor:not-allowed; } .login{ margin-top:22px; color:#B8B5C5; } .login a{ color:#A855F7; text-decoration:none; font-weight:bold; } .back{ display:inline-block; margin-top:22px; color:#B8B5C5; text-decoration:none; font-size:14px; } .message{ margin-top:15px; color:#A855F7; display:none; line-height:1.5; } </style> </head> <body> <div class="signup-box"> <div class="logo">RJ 👑</div> <div class="subtitle"> Join the RJ App World </div> <h1>Create Account 📝</h1> <form id="signupForm"> <div class="input-group"> <label>Username</label> <input type="text" id="username" placeholder="Enter your username" maxlength="50" required > </div> <div class="input-group"> <label>Email</label> <input type="email" id="email" placeholder="Enter your email" required > </div> <div class="input-group"> <label>Password</label> <input type="password" id="password" placeholder="Create a password" minlength="6" required > </div> <div class="input-group"> <label>Confirm Password</label> <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6" required > </div> <button type="submit" class="signup-btn" id="signupButton"> Create Account </button> </form> <div class="message" id="message"></div> <div class="login"> Already have an account? <a href="login.html">Login</a> </div> <a class="back" href="index.html"> ← Back to Home </a> </div> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script> const SUPABASE_URL = "https://sjdcibubjyqomtnrendp.supabase.co"; const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fc0Bzqf0twSVvcOfxJKjTQ_LGRDIjhH"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY ); const form = document.getElementById("signupForm"); const message = document.getElementById("message"); const signupButton = document.getElementById("signupButton"); function showMessage(text){ message.textContent = text; message.style.display = "block"; } form.addEventListener( "submit", async function(event){ event.preventDefault(); const username = document.getElementById("username") .value.trim(); const email = document.getElementById("email") .value.trim(); const password = document.getElementById("password") .value; const confirmPassword = document.getElementById("confirmPassword") .value; if(!username){ showMessage( "Username enter karo ❌" ); return; } if(password !== confirmPassword){ showMessage( "Passwords match nahi karte ❌" ); return; } if(password.length < 6){ showMessage( "Password kam az kam 6 characters ka hona chahiye ❌" ); return; } signupButton.disabled = true; signupButton.textContent = "Creating Account..."; try{ const { data, error } = await supabaseClient.auth.signUp({ email: email, password: password, options: { data: { username: username } } }); if(error){ showMessage( "Signup failed: " + error.message + " ❌" ); signupButton.disabled = false; signupButton.textContent = "Create Account"; return; } if(data.user){ localStorage.setItem( "rjUser", JSON.stringify({ username: username, email: email }) ); if(data.session){ localStorage.setItem( "rjLoggedIn", "true" ); showMessage( "Account successfully created! 👑🔥" ); setTimeout(function(){ window.location.href = "profile.html"; },1000); }else{ localStorage.setItem( "rjLoggedIn", "false" ); showMessage( "Account ban gaya! 👑❤️ Email check karo aur verification link par click karo." ); signupButton.disabled = false; signupButton.textContent = "Create Account"; } } }catch(error){ showMessage( "Kuch error aa gaya. Dobara try karo ❌" ); signupButton.disabled = false; signupButton.textContent = "Create Account"; } } ); </script> </body> </html>
