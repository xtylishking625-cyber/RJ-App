<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile • RJ App 👑</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070312;
  color:white;
}

header{
  background:linear-gradient(135deg,#12061F,#8B5CF6);
  padding:35px 20px;
  text-align:center;
}

header h1{
  font-size:32px;
}

main{
  max-width:800px;
  margin:auto;
  padding:25px 15px;
}

.back{
  display:inline-block;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 17px;
  border-radius:10px;
  margin-bottom:25px;
}

.profile{
  background:#12061F;
  border:1px solid #34204d;
  border-radius:20px;
  padding:30px;
  text-align:center;
}

.avatar{
  width:110px;
  height:110px;
  margin:auto;
  border-radius:50%;
  background:#8B5CF6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

h2{
  margin-top:15px;
  font-size:27px;
}

.role{
  color:#b8b5c5;
  margin-top:8px;
}

.bio{
  color:#b8b5c5;
  margin-top:12px;
  line-height:1.5;
}

.info{
  margin-top:10px;
  color:#b8b5c5;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:25px;
}

.stat{
  background:#211034;
  padding:15px 8px;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#b8b5c5;
  font-size:12px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  border:none;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.edit-box{
  display:none;
  margin-top:25px;
  background:#211034;
  padding:20px;
  border-radius:15px;
  text-align:left;
}

.edit-box h3{
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  color:#b8b5c5;
}

input,textarea{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#12061F;
  color:white;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.save{
  margin-top:18px;
  width:100%;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#12061F;
  color:#b8b5c5;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  header h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <h1>👤 RJ APP — Profile</h1>
</header>

<main>

<a class="back" href="index.html">🏠 Back to Home</a>

<div class="profile">

  <div class="avatar" id="avatar">👑</div>

  <h2 id="profileName">Raja King 👑</h2>

  <p class="role" id="profileRole">
    Author • Reader • Story Creator
  </p>

  <p class="bio" id="profileBio">
    Welcome to Raja King World 👑
  </p>

  <p class="info" id="profileLocation">
    📍 Taxila, Pakistan
  </p>

  <div class="stats">

    <div class="stat">
      <strong>0</strong>
      <span>Fans</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Stories</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Views</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Likes</span>
    </div>

  </div>

  <div class="buttons">

    <button class="btn" id="editBtn">
      ✏️ Edit Profile
    </button>

    <a class="btn" href="stories.html">
      📖 My Stories
    </a>

  </div>

  <div class="edit-box" id="editBox">

    <h3>✏️ Edit Your Profile</h3>

    <label>Name</label>
    <input id="nameInput" type="text" placeholder="Enter your name">

    <label>Role</label>
    <input id="roleInput" type="text" placeholder="Author • Reader">

    <label>Bio</label>
    <textarea id="bioInput" placeholder="Write something about yourself"></textarea>

    <label>Location</label>
    <input id="locationInput" type="text" placeholder="Your location">

    <label>Avatar Emoji</label>
    <input id="avatarInput" type="text" placeholder="👑">

    <button class="btn save" id="saveBtn">
      💾 Save Changes
    </button>

  </div>

</div>

</main>

<footer>
  © 2026 RJ App 👑
</footer>

<script>

const editBtn = document.getElementById("editBtn");
const editBox = document.getElementById("editBox");
const saveBtn = document.getElementById("saveBtn");

const profileName = document.getElementById("profileName");
const profileRole = document.getElementById("profileRole");
const profileBio = document.getElementById("profileBio");
const profileLocation = document.getElementById("profileLocation");
const avatar = document.getElementById("avatar");

const nameInput = document.getElementById("nameInput");
const roleInput = document.getElementById("roleInput");
const bioInput = document.getElementById("bioInput");
const locationInput = document.getElementById("locationInput");
const avatarInput = document.getElementById("avatarInput");

const savedProfile = JSON.parse(
  localStorage.getItem("rjProfile") || "null"
);

if(savedProfile){

  profileName.textContent = savedProfile.name;
  profileRole.textContent = savedProfile.role;
  profileBio.textContent = savedProfile.bio;
  profileLocation.textContent = "📍 " + savedProfile.location;
  avatar.textContent = savedProfile.avatar;

}

editBtn.addEventListener("click", function(){

  nameInput.value = profileName.textContent;
  roleInput.value = profileRole.textContent;
  bioInput.value = profileBio.textContent;
  locationInput.value = profileLocation.textContent.replace("📍 ","");
  avatarInput.value = avatar.textContent;

  editBox.style.display =
    editBox.style.display === "block" ? "none" : "block";

});

saveBtn.addEventListener("click", function(){

  const profile = {

    name: nameInput.value.trim() || "Raja King 👑",

    role: roleInput.value.trim() ||
    "Author • Reader • Story Creator",

    bio: bioInput.value.trim() ||
    "Welcome to Raja King World 👑",

    location: locationInput.value.trim() ||
    "Pakistan",

    avatar: avatarInput.value.trim() || "👑"

  };

  localStorage.setItem(
    "rjProfile",
    JSON.stringify(profile)
  );

  profileName.textContent = profile.name;
  profileRole.textContent = profile.role;
  profileBio.textContent = profile.bio;
  profileLocation.textContent = "📍 " + profile.location;
  avatar.textContent = profile.avatar;

  editBox.style.display = "none";

  alert("Profile updated successfully! 👑🔥");

});

</script>

</body>
</html>
