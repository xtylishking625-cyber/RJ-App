<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Story • RJ App 👑</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070312;
  color:white;
}

header{
  background:linear-gradient(135deg,#12061F,#8B5CF6);
  padding:30px 20px;
  text-align:center;
}

header h1{
  font-size:32px;
}

header p{
  margin-top:8px;
  color:#eee;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  padding:15px;
  background:#12061F;
}

nav a{
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
}

main{
  max-width:850px;
  margin:auto;
  padding:25px 15px;
}

.panel{
  background:#12061F;
  border:1px solid #34204d;
  border-radius:18px;
  padding:25px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:8px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #34204d;
  background:#070312;
  color:white;
  font-size:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

.cover-preview{
  width:180px;
  height:240px;
  margin-top:15px;
  border-radius:12px;
  border:1px solid #34204d;
  background:linear-gradient(135deg,#8B5CF6,#A855F7,#070312);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:50px;
}

.cover-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.btn{
  margin-top:20px;
  background:#8B5CF6;
  color:white;
  border:0;
  padding:13px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

.btn:hover{
  background:#A855F7;
}

.message{
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:#211034;
  border:1px solid #8B5CF6;
  line-height:1.6;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#12061F;
  color:#b8b5c5;
}

</style>
</head>

<body>

<header>

<h1>📤 RJ APP</h1>

<p>Upload Your Story 👑</p>

</header>


<nav>

<a href="index.html">🏠 Home</a>

<a href="stories.html">📖 Stories</a>

<a href="my-stories.html">✍️ My Stories</a>

<a href="profile.html">👤 Profile</a>

<a href="bookmarks.html">🔖 Bookmarks</a>

</nav>


<main>

<div class="panel">

<h2>✍️ Create New Story</h2>

<p style="margin-top:8px;color:#b8b5c5;">
Apni story ki information fill karo aur RJ App par apni story save karo.
</p>


<form id="storyForm">


<label for="cover">
🖼️ Book Cover
</label>

<input
type="file"
id="cover"
accept="image/*"
>

<div class="cover-preview" id="coverPreview">
📖
</div>


<label for="title">
📖 Story Title
</label>

<input
type="text"
id="title"
placeholder="Enter your story title"
required
>


<label for="genre">
🏷️ Genre
</label>

<select id="genre" required>

<option value="">
Select Genre
</option>

<option value="Romance">
Romance
</option>

<option value="Mafia">
Mafia
</option>

<option value="Action">
Action
</option>

<option value="Mystery">
Mystery
</option>

<option value="Fantasy">
Fantasy
</option>

<option value="Drama">
Drama
</option>

</select>


<label for="description">
📝 Story Description
</label>

<textarea
id="description"
placeholder="Write a short description of your story..."
required
></textarea>


<label for="chapter">
📚 Chapter 1
</label>

<textarea
id="chapter"
placeholder="Write Chapter 1 here..."
required
></textarea>


<button
class="btn"
type="submit"
>
📤 Submit Story
</button>

</form>


<div
class="message"
id="message"
></div>

</div>

</main>


<footer>

© 2026 RJ App 👑

<p style="margin-top:8px;">
Welcome to Raja King World
</p>

</footer>


<script>

let coverData = "";


const coverInput =
document.getElementById("cover");


const coverPreview =
document.getElementById("coverPreview");


coverInput.addEventListener("change",function(){

  const file = this.files[0];

  if(!file){
    coverData = "";
    coverPreview.innerHTML = "📖";
    return;
  }


  if(!file.type.startsWith("image/")){

    alert("Please select an image file.");

    this.value = "";

    return;
  }


  const reader =
  new FileReader();


  reader.onload = function(e){

    coverData = e.target.result;

    coverPreview.innerHTML =
      '<img src="' +
      coverData +
      '" alt="Book Cover">';

  };


  reader.readAsDataURL(file);

});


document
.getElementById("storyForm")
.addEventListener("submit",function(e){

  e.preventDefault();


  const title =
    document.getElementById("title").value.trim();


  const genre =
    document.getElementById("genre").value;


  const description =
    document.getElementById("description").value.trim();


  const chapter =
    document.getElementById("chapter").value.trim();


  if(!title ||
     !genre ||
     !description ||
     !chapter){

    alert("Please fill all required fields.");

    return;

  }


  const stories =
    JSON.parse(
      localStorage.getItem("rjUploadedStories") || "[]"
    );


  const newStory = {

    id:Date.now(),

    title:title,

    genre:genre,

    description:description,

    cover:coverData,

    chapters:[
      {
        number:1,
        title:"Chapter 1",
        content:chapter
      }
    ],

    chapterCount:1,

    views:0,

    likes:0,

    fans:0,

    author:"Raja King",

    contractStatus:"Not Applied",

    createdAt:new Date().toISOString()

  };


  stories.push(newStory);


  localStorage.setItem(
    "rjUploadedStories",
    JSON.stringify(stories)
  );


  const message =
    document.getElementById("message");


  message.style.display = "block";


  message.innerHTML =
    "🎉 <strong>Story Successfully Saved!</strong><br><br>" +

    "📖 " + title + "<br>" +

    "🖼️ Book Cover: " +
    (coverData ? "Added ✅" : "Not Added") +
    "<br>" +

    "📚 Chapters: 1<br>" +

    "📝 Contract: Not Applied<br><br>" +

    "Ab tum My Stories mein apni book dekh sakte ho.";


  document
  .getElementById("storyForm")
  .reset();


  coverData = "";

  coverPreview.innerHTML = "📖";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});

</script>

</body>
</html>
