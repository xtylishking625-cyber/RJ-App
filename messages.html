<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages • RJ App 👑</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#070312;
  color:white;
}

header{
  background:linear-gradient(135deg,#12061F,#8B5CF6);
  padding:30px 20px;
  text-align:center;
}

header h1{font-size:32px}

header p{
  margin-top:8px;
  color:#eee;
}

main{
  max-width:800px;
  margin:auto;
  padding:25px 15px;
}

.back{
  display:inline-block;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 17px;
  border-radius:10px;
  margin-bottom:25px;
}

.panel{
  background:#12061F;
  border:1px solid #34204d;
  border-radius:18px;
  padding:25px;
}

.message{
  background:#211034;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.message h3{margin-bottom:7px}

.message p{
  color:#b8b5c5;
  line-height:1.5;
}

.btn{
  display:inline-block;
  margin-top:20px;
  background:#8B5CF6;
  color:white;
  text-decoration:none;
  padding:11px 17px;
  border-radius:10px;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#12061F;
  color:#b8b5c5;
}
</style>
</head>

<body>

<header>
  <h1>💌 RJ APP — Messages</h1>
  <p>Chat with readers and authors 👑</p>
</header>

<main>

<a class="back" href="index.html">🏠 Back to Home</a>

<div class="panel">

  <h2>💬 Your Messages</h2>

  <div class="message">
    <h3>👤 No conversations yet</h3>
    <p>
      Your messages with readers and authors
      will appear here.
    </p>
  </div>

  <a class="btn" href="stories.html">
    📖 Find Stories
  </a>

</div>

</main>

<footer>
  © 2026 RJ App 👑
</footer>

</body>
</html>
